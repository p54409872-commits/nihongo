<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>yueyue小朋友和姐姐的练习册</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#222;--muted:#777;--line:#e4e1d8;--accent:#0f6e56;--accent-bg:#e1f5ee;--ng:#a32d2d;--ng-bg:#fcebeb;--warn-bg:#faeeda;--warn:#854f0b;--gold-bg:#fff4d6;--gold:#7a5300;--pink:#993556;--pink-bg:#fbeaf0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","PingFang SC","Noto Sans JP","Microsoft YaHei",sans-serif;line-height:1.7}
.wrap{max-width:760px;margin:0 auto;padding:24px 16px 60px}
h1{font-size:22px;margin:0 0 6px;color:var(--pink)}
.greet{background:var(--pink-bg);color:var(--pink);border-radius:10px;padding:10px 14px;font-size:16px;font-weight:bold;margin:10px 0 14px}
.profiles{display:flex;gap:8px;flex-wrap:wrap}
.pf{padding:8px 16px;border-radius:20px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:15px}
.pf.on{background:var(--pink);color:#fff;border-color:var(--pink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:14px}
.hidden{display:none}
.muted{color:var(--muted);font-size:13px}
.barw{height:10px;background:var(--line);border-radius:5px;overflow:hidden;margin:8px 0}
.barw>div{height:100%;background:var(--accent);transition:width .3s}
.dash-top{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px}
.dash-big{font-size:20px;font-weight:bold;color:var(--accent)}
.cheer{background:var(--accent-bg);color:var(--accent);border-radius:8px;padding:10px 12px;font-size:14px;margin-top:10px}
.tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.tab{flex:1;min-width:90px;padding:10px;border:1px solid var(--line);background:var(--card);border-radius:8px;font-size:15px;cursor:pointer}
.tab.on{background:var(--accent);color:#fff;border-color:var(--accent)}
select{padding:5px 8px;border-radius:8px;border:1px solid var(--line);font-size:14px}
.qtop{font-size:13px;color:var(--accent);margin-bottom:4px}
.qhead{font-size:19px;font-weight:bold}
.box{background:var(--accent-bg);border-radius:10px;padding:12px 14px;margin:12px 0}
.box .big{font-size:22px;color:var(--accent)}

.lbl{display:inline-block;font-size:12px;color:var(--accent);background:var(--accent-bg);border-radius:10px;padding:0 8px;margin-right:8px}
.row{margin:8px 0}
.inputrow{display:flex;gap:8px;margin-top:14px}
input[type=text]{flex:1;min-width:0;font-size:20px;padding:10px 12px;border:1px solid var(--line);border-radius:8px}
.btn{padding:9px 16px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:15px}
.btn.main{background:var(--accent);color:#fff;border-color:var(--accent)}
.mini{padding:2px 10px;border-radius:6px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:13px;margin-left:6px}
.link{background:none;border:none;color:var(--accent);cursor:pointer;font-size:14px;padding:0;margin-top:10px;text-decoration:underline}
.hint{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:10px 12px;font-size:14px;margin-top:8px}
.err{color:var(--ng);font-size:13px;margin-top:6px}
.ok-h{color:var(--accent);font-size:19px;font-weight:bold}
.ng-h{color:var(--ng);font-size:19px;font-weight:bold}
.praise{color:var(--accent);font-size:14px}
.comfort{color:var(--muted);font-size:14px}
.celebrate{background:var(--gold-bg);color:var(--gold);border-radius:10px;padding:12px 14px;margin:10px 0;font-size:15px;font-weight:bold}
.diag{background:var(--ng-bg);color:var(--ng);border-radius:8px;padding:10px 12px;font-size:14px;margin:10px 0}
.note{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:10px 12px;font-size:14px;margin:10px 0}
h3{font-size:16px;margin:18px 0 8px}
table{width:100%;border-collapse:collapse;font-size:15px}
td,th{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}
th{font-size:13px;color:var(--muted);font-weight:normal}
tr.cur td{background:var(--accent-bg)}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.ex{border-bottom:1px dashed var(--line);padding:8px 0}
.exja{font-size:17px}
.unit{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;cursor:pointer}
.unit.sel{border-color:var(--accent);background:var(--accent-bg)}
.unit.lock{opacity:.5;cursor:default}
.unit .ur{text-align:right;white-space:nowrap}
.lv{font-size:12px;background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:0 8px;margin-left:4px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}
.cell{border-radius:8px;padding:4px 0;text-align:center;font-size:12px;background:#f1efe8;color:var(--muted);min-height:44px}

.cell.part{background:var(--accent-bg);color:var(--accent)}
.cell.done{background:var(--accent);color:#fff}
.cell.today{outline:2px solid var(--pink)}
.cell b{display:block;font-size:14px}
details summary{cursor:pointer;font-weight:bold}
</style>
</head>

const CLS = {g:"一类动词（五段）",i:"二类动词（一段）",s:"三类动词（する）",k:"三类动词（来る）"};
const ROW = {"う":"わいうえお","く":"かきくけこ","ぐ":"がぎぐげご","す":"さしすせそ","つ":"たちつてと","ぬ":"なにぬねの","ぶ":"ばびぶべぼ","む":"まみむめも","る":"らりるれろ"};
const VOICE = ["pot","pas","cau","cp","cpS"];

const row = (f,i) => ROW[f.k.slice(-1)][i];
const cut = (f,n,add,t) => ({k:f.k.slice(0,f.k.length-n)+add, r:f.r.slice(0,f.r.length-n)+add, t});
function gTe(f,ta){
  const ch=f.k.slice(-1);
  const m={"う":"っ","つ":"っ","る":"っ","む":"ん","ぶ":"ん","ぬ":"ん","く":"い","ぐ":"い","す":"し"};
  let s=m[ch], v=["む","ぶ","ぬ","ぐ"].includes(ch);
  if(f.k==="行く"){s="っ";v=false;}
  return s+(v?(ta?"だ":"で"):(ta?"た":"て"));
}
function V(f,g,i,s,k,t){

  if(f.t==="g") return cut(f,1,g(f),t);
  if(f.t==="i") return cut(f,1,i,t);
  if(f.t==="s") return cut(f,2,s,t);
  return {k:"来"+k[1], r:k[0]+k[1], t};
}

  nai:{label:"否定形（ない）",fn:f=>V(f,f=>row(f,0)+"ない","ない","しない",["こ","ない"],"adj")},
  masu:{label:"ます形",fn:f=>V(f,f=>row(f,1)+"ます","ます","します",["き","ます"],"masu")},
  te:{label:"て形",fn:f=>V(f,f=>gTe(f,false),"て","して",["き","て"],"end")},
  ta:{label:"た形（过去）",fn:f=>V(f,f=>gTe(f,true),"た","した",["き","た"],"ta")},
  ba:{label:"ば条件形",fn:f=>V(f,f=>row(f,3)+"ば","れば","すれば",["く","れば"],"end")},
  vol:{label:"意向形",fn:f=>V(f,f=>row(f,4)+"う","よう","しよう",["こ","よう"],"end")},
  imp:{label:"命令形",fn:f=>V(f,f=>row(f,3),"ろ","しろ",["こ","い"],"end")},
  teiru:{label:"ている形",fn:f=>{const x=OPS.te.fn(f);return {k:x.k+"いる",r:x.r+"いる",t:"i"};}},
  adjPast:{label:"过去否定（なかった）",fn:f=>cut(f,1,"かった","ta")},
  adjTe:{label:"なくて形",fn:f=>cut(f,1,"くて","end")},
  adjBa:{label:"なければ（ば条件）",fn:f=>cut(f,1,"ければ","end")},
  tara:{label:"たら条件形",fn:f=>cut(f,0,"ら","end")},
  masen:{label:"礼貌否定（ません）",fn:f=>cut(f,1,"せん","masen")},
  mashita:{label:"礼貌过去（ました）",fn:f=>cut(f,1,"した","end")},
  mashou:{label:"礼貌意向（ましょう）",fn:f=>cut(f,1,"しょう","end")},
  msd:{label:"礼貌过去否定（ませんでした）",fn:f=>cut(f,0,"でした","end")}
};

const HINT = {
  pot:"一类：う段→え段＋る（書く→書ける）；二类：去る＋られる；する→できる；来る→来られる（こられる）",

  pas:"一类：う段→あ段＋れる（う→わ）；二类：去る＋られる；する→される；来る→来られる",
  cau:"一类：う段→あ段＋せる；二类：去る＋させる；する→させる；来る→来させる（こさせる）",
  cp:"一类：あ段＋せられる（す结尾以外也可以说あ段＋される）；二类：去る＋させられる；する→させられる；来る→来させられる",
  nai:"一类：う段→あ段＋ない（う→わ）；二类：去る＋ない；する→しない；来る→来ない（こない）。可能形、被动形等变完后都按二类处理",
  masu:"一类：う段→い段＋ます；二类：去る＋ます；する→します；来る→来ます（きます）",
  te:"一类：う・つ・る→って；む・ぶ・ぬ→んで；く→いて；ぐ→いで；す→して；行く→行って。二类：去る＋て。する→して；来る→来て（きて）",
  ta:"和て形规则相同，把て／で换成た／だ",
  ba:"一类：う段→え段＋ば；二类：去る＋れば；する→すれば；来る→来れば（くれば）",
  vol:"一类：う段→お段＋う；二类：去る＋よう；する→しよう；来る→来よう（こよう）",
  imp:"一类：う段→え段；二类：去る＋ろ；する→しろ；来る→来い（こい）",
  teiru:"先变成て形，再加「いる」",
  adjPast:"ない→なかった（去掉い，加かった）",
  adjTe:"ない→なくて",
  adjBa:"ない→なければ",
  tara:"在た形（〜た／〜だ／〜なかった）后面加「ら」",
  masen:"ます→ません",
  mashita:"ます→ました",
  mashou:"ます→ましょう",
  msd:"ません→ませんでした"
};

function allowed(st){
  if(["g","i","s","k"].includes(st.t)){
    if(st.voice||st.teiru) return ["nai","masu","te","ta","ba"];
    return ["pot","pas","cau","cp","nai","masu","te","ta","ba","vol","imp","teiru"];
  }
  return ({adj:["adjPast","adjTe","adjBa"],ta:["tara"],masu:["masen","mashita","mashou"],masen:["msd"]})[st.t]||[];
}
const base = v => ({k:v.k,r:v.r,t:v.t,voice:null,teiru:false,fl:{}});

function run(verb,ops){
  let st=base(verb);

  const steps=[];
  for(const op of ops){
    if(!allowed(st).includes(op==="cpS"?"cp":op)) return null;
    const x=OPS[op].fn(st);
    const fl={...st.fl};
    if(op==="nai"||op==="masen") fl.neg=true;
    if(["ta","adjPast","mashita","msd"].includes(op)) fl.past=true;
    if(op==="masu"||op==="masen") fl.pol=true;
    if(["tara","ba","adjBa"].includes(op)) fl.cond=true;
    if(op==="te"||op==="adjTe") fl.te=true;
    if(op==="vol") fl.vol=true;
    if(op==="imp") fl.imp=true;
    if(op==="mashou") fl.mashou=true;
    st={k:x.k,r:x.r,t:x.t,voice:VOICE.includes(op)?(op==="cpS"?"cp":op):st.voice,teiru:st.teiru||op==="teiru",fl,op};
    steps.push(st);
  }
  return steps;
}

function zh(st){
  const v=chain.verb.zh, fl=st.fl||{};
  const core={pas:"被"+v,cau:"让人"+v,cp:"被迫"+v}[st.voice]||v;
  let s;
  if(st.voice==="pot") s=fl.neg?(fl.past?"没能":"不能")+v:"能"+v+(fl.past?"了":"");
  else if(st.teiru) s=fl.neg?(fl.past?"当时还没":"还没")+core:(fl.past?"当时正在／已经":"正在／已经")+core;
  else s=fl.neg?(fl.past?"没有":"不")+core:core+(fl.past?"了":"");
  if(fl.cond) s="如果"+s;
  if(fl.te) s+="（て形，连接下文）";
  if(fl.vol) s="打算"+s+"／"+s+"吧";
  if(fl.imp) s+="！（命令）";
  if(fl.mashou) s="一起"+s+"吧";
  if(fl.pol&&!fl.mashou) s+="（礼貌）";

  return s;
}

let chain=null, j=0, phase="ask", firstTry=true, mode="course", selUnit=Math.min(curUnit(),6), level=2, reviewIdx=0, justPassed=false, lastOk=false;

function speak(text){

function genOps(verb,mn,mx){
  const L=mn+Math.floor(Math.random()*(mx-mn+1));
  const ops=[];
  for(let i=0;i<L;i++){
    const cur=ops.length?run(verb,ops).at(-1):base(verb);
    let c=allowed(cur);
    if(!c.length) break;
    if(i===0&&Math.random()<0.5) c=c.filter(o=>VOICE.includes(o));
    if(L-i>1){
      const c2=c.filter(o=>{const s=run(verb,[...ops,o]);return s&&allowed(s.at(-1)).length>0;});
      if(c2.length) c=c2;
    }
    ops.push(pick(c));
  }
  return ops;
}
function build(verb,ops){
  let alt=null;

  if(ops[0]==="cp"&&verb.t==="g"&&verb.k.slice(-1)!=="す") alt=run(verb,["cpS",...ops.slice(1)]);
  return {verb,ops,steps:run(verb,ops),alt};
}

function newChain(){
  if(mode==="review"){
    S.wrong=S.wrong.filter(w=>VERBS[w.vi]&&run(VERBS[w.vi],w.ops));
    if(!S.wrong.length){showEmptyReview();return;}
    const w=S.wrong[reviewIdx%S.wrong.length];
    chain=build(VERBS[w.vi],w.ops);
    chain.review=w;
    j=w.j;
    showQ();
    return;
  }
  const verb=pick(VERBS);
  let ops;
  if(mode==="course"){
    const u=UNITS[selUnit-1];
    ops=u.tpl?pick(u.tpl).slice():genOps(verb,4,6);
  } else {
    const [mn,mx]=({1:[2,3],2:[3,4],3:[4,6]})[level];
    ops=genOps(verb,mn,mx);
  }
  chain=build(verb,ops);
  j=0;
  showQ();
}

    <div class="row"><span class="lbl">要求</span>在已知形式的基础上变成「${OPS[t.op].label}」。写标准完整形式，不使用ら抜き言葉，只写一个动词，不造句。</div>

function variants(pre){
  const vIdx=pre.findIndex(o=>VOICE.includes(o));
  const rest=vIdx>=0?pre.filter((o,i)=>i!==vIdx):pre.slice();
  const list=[rest,["pot",...rest],["pas",...rest],["cau",...rest],["cp",...rest]];
  if(vIdx<0) list.push(["teiru",...rest]);
  return list.filter(v=>v.join()!==pre.join());
}
function lastOf(ops){
  if(!ops.length) return {...base(chain.verb),op:null};
  const s=run(chain.verb,ops);
  return s?s.at(-1):null;
}
const routeLabel=ops=>ops.length?ops.map(o=>OPS[o].label).join(" → "):"原形";

function diagnose(val){
  const {verb,steps}=chain, t=steps[j], pre=chain.ops.slice(0,j+1);
  if(["i","k"].includes(verb.t)&&t.voice==="pot"){
    if(val===t.k.replace("られ","れ")||val===t.r.replace("られ","れ"))
      return "这是「ら抜き言葉」（漏掉了「ら」）。口语里常听到，但标准形式要保留「られ」。";
  }
  for(let i=0;i<j;i++){
    if(val===steps[i].k||val===steps[i].r)
      return `你写到「${OPS[steps[i].op].label}」就停了，还差后面的「${OPS[t.op].label}」。`;
  }
  if(val===verb.k||val===verb.r) return "你写的是原形，还没有变形。";
  for(const v of variants(pre)){

    const l=lastOf(v);
    if(l&&(val===l.k||val===l.r))
      return `你写的是「${routeLabel(v)}」，意思是“${esc(zh(l))}”。本题要的是“${esc(zh(t))}”。`;
  }
  return "形式不对。对照下面的变形路线，找出是哪一步出了问题。";
}

function compareRows(){
  const pre=chain.ops.slice(0,j+1);
  const vIdx=pre.findIndex(o=>VOICE.includes(o));
  const rest=vIdx>=0?pre.filter((o,i)=>i!==vIdx):pre.slice();
  const cand=[pre,rest,["pot",...rest],["pas",...rest]];
  if(vIdx<0) cand.push(["teiru",...rest]);
  const seen=new Set(), rows=[];
  for(const v of cand){
    const l=lastOf(v);
    if(!l||seen.has(l.k)) continue;
    seen.add(l.k);
    rows.push({cur:v===pre,zh:zh(l),f:l});
  }
  return rows;
}

function submit(){
  if(phase!=="ask") return;
  const input=document.getElementById("ans");
  const val=norm(input.value);
  if(!val){document.getElementById("err").textContent="请先输入答案";return;}
  const {verb,steps,alt}=chain, t=steps[j];
  const accepted=[t.k,t.r];
  if(alt) accepted.push(alt[j].k,alt[j].r);
  const ok=accepted.includes(val);

  lastOk=ok;
  const cheers=[];

  if(firstTry){
    S.total++;
    if(ok){S.correct++;S.streak++;S.best=Math.max(S.best,S.streak);}
    else S.streak=0;
    if(ok&&[5,10,20,30,50,100].includes(S.streak)) cheers.push(`连续答对 ${S.streak} 题！状态非常好！`);

    const d=today(), before=S.days[d]||0;
    S.days[d]=before+1;
    if(before+1===S.goal){
      S.checkins[d]=true;
      cheers.push(`打卡成功！今天的 ${S.goal} 题完成了，${pname()}是最棒的！继续做就是超前进度。`);
    } else if(before+1>S.goal&&(before+1-S.goal)%10===0) cheers.push(`今天已经超前做了 ${before+1-S.goal} 题，太拼了！`);

    if(mode==="course"){
      const u=UNITS[selUnit-1], U=S.units[selUnit];
      U.done++; if(ok) U.ok++;
      U.recent.push(ok?1:0); U.recent=U.recent.slice(-20);
      S.course++;
      if(!U.passed&&U.done>=u.total){
        if(acc(U)>=0.8){
          U.passed=true; justPassed=true;
          const nx=UNITS[selUnit];
          cheers.push(`恭喜通过单元${u.id}「${u.name}」！`+(nx?`已解锁单元${nx.id}「${nx.name}」（${nx.lv}）。`:"全部6个单元都完成了，太厉害了！"));
        } else if(U.done===u.total){
          cheers.push(`单元${u.id}的${u.total}题做完了！最近20题正确率 ${Math.round(acc(U)*100)}%，再巩固几题达到80%就能过关。`);
        }
      }
    }


    if(mode==="review"){
      if(ok){
        const w=chain.review;
        S.wrong=S.wrong.filter(x=>x!==w);
        cheers.push("这道错题攻克了，已从错题本移除！");
      }
    } else if(!ok){
      const key=VERBS.indexOf(verb)+"|"+chain.ops.join()+"|"+j;
      if(!S.wrong.some(w=>w.key===key)){
        S.wrong.unshift({key,vi:VERBS.indexOf(verb),ops:chain.ops,j,ans:t.k});
        S.wrong=S.wrong.slice(0,60);
      }
    }
    save();
  }
  firstTry=false;
  phase=ok?"done":"wrong";
  input.disabled=true;

  let h=ok?`<div class="ok-h">第${S.n}题：完全正确！</div><div class="praise">${pick(PRAISE)}</div>`
          :`<div class="ng-h">第${S.n}题：还差一点</div><div class="comfort">${pick(COMFORT)}</div>`;
  cheers.forEach(c=>{h+=`<div class="celebrate">${c}</div>`;});
  h+=`<div class="row">你的答案：「${esc(val)}」</div>`;
  h+=`<div class="row">正确答案：「${fmt(t)}」<button class="mini" onclick="speakAns()">朗读</button></div>`;
  if(alt) h+=`<div class="muted">也可以说「${fmt(alt[j])}」（使役被动的短形式，口语常用）</div>`;
  if(!ok) h+=`<div class="diag">${diagnose(val)}</div>`;

  h+=`<h3>一、完整变形路线</h3><div class="muted">动词类别：${CLS[verb.t]}</div>
    <table><tr><th>步骤</th><th>形式</th><th>意思</th></tr>
    <tr><td>原形</td><td>${fmt(verb)}</td><td>${verb.zh}</td></tr>`;
  for(let i=0;i<=j;i++){
    const s=steps[i];

    h+=`<tr class="${i===j?"cur":""}"><td>${OPS[s.op].label}</td><td>${fmt(s)}</td><td>${esc(zh(s))}</td></tr>`;
  }
  h+=`</table>`;

  const rows=compareRows();
  if(rows.length>=2){
    h+=`<h3>二、相似形式的区别</h3><table><tr><th>中文</th><th>日语</th><th></th></tr>`;
    rows.forEach(r=>{h+=`<tr class="${r.cur?"cur":""}"><td>${esc(r.zh)}</td><td>${fmt(r.f)}</td><td>${r.cur?"本题":""}</td></tr>`;});
    h+=`</table>`;
  }
  if(["i","k"].includes(verb.t)&&(t.voice==="pot"||t.voice==="pas"))
    h+=`<div class="note">注意：二类动词和「来る」的可能形与被动形同形（都是〜られる），实际交流时要看上下文判断。</div>`;

  if(verb.ex&&verb.ex.length){
    h+=`<h3>三、应用场景（「${verb.k}」在实际中的用法）</h3>`;
    verb.ex.forEach((e,i)=>{
      h+=`<div class="ex"><span class="lv">${e.s}</span> <span class="exja">${e.ja}</span><button class="mini" onclick="speakEx(${i})">朗读</button><div class="muted">${e.zh}</div></div>`;
    });
  }

  const last=j===steps.length-1;
  let nextLabel="下一题";
  if(mode!=="review") nextLabel=last?"下一题（换新动词）":"下一题（再加一步）";
  if(justPassed) nextLabel="进入下一单元";
  h+=`<div class="btns">`;
  if(!ok) h+=`<button class="btn" onclick="retry()">再试一次</button>`;
  h+=`<button class="btn main" onclick="next()">${nextLabel}</button></div>`;

  const res=document.getElementById("res");
  res.innerHTML=h;
  res.classList.remove("hidden");
  renderAll();

}

function retry(){
  phase="ask";
  const input=document.getElementById("ans");
  input.disabled=false; input.value=""; input.focus();
  document.getElementById("res").classList.add("hidden");
}

function next(){
  S.n++; save();
  if(mode==="review"){
    if(!lastOk) reviewIdx++;
    newChain(); return;
  }
  if(justPassed){
    justPassed=false;
    selUnit=Math.min(curUnit(),6);
    newChain(); return;
  }
  if(j<chain.steps.length-1){j++;showQ();}
  else newChain();
}

  save();
  pid=id; load(pid); save();
  mode="course"; reviewIdx=0; justPassed=false; selUnit=Math.min(curUnit(),6);
  newChain();
}

function checkinStreak(){
  const d=new Date();
  if(!S.checkins[fmtDate(d)]) d.setDate(d.getDate()-1);
  let k=0;
  while(S.checkins[fmtDate(d)]){k++;d.setDate(d.getDate()-1);}
  return k;
}

function renderHeader(){
  document.getElementById("profiles").innerHTML=PROFILES.map(p=>
    `<button class="pf ${p.id===pid?"on":""}" onclick="switchProfile('${p.id}')">${p.name}</button>`).join("");
  document.getElementById("greet").textContent=`${pname()}，我是最棒的，今天也加油呀！`;
}

function renderDash(){
  const P=plan(), t=today(), tc=S.days[t]||0, g=S.goal;
  const cal=Math.min(P.length,dayDiff(S.start,t)+1);
  const prog=Math.floor(S.course/g)+1;
  const dayNow=Math.min(prog,P.length);

  const ahead=dayNow-cal;
  const pct=S.total?Math.round(S.correct/S.total*100):0;
  let msg;
  if(prog>P.length) msg=`${P.length}天计划全部完成！接下来用错题复习和自由练习保持手感。`;
  else if(tc===0) msg=`今天还没开始。${g}题大约${Math.round(g*0.8)}分钟，先做5题热热身也很好。`;
  else if(tc<g) msg=`还差 ${g-tc} 题就能打卡了，加油！`;
  else msg=`今天已打卡 ✓ 想多做就继续，超前的题都会算进计划进度。`;
  if(prog<=P.length){
    if(ahead>0) msg+=` 你目前超前计划 ${ahead} 天。`;
    else if(ahead<0) msg+=` 比日历计划慢 ${-ahead} 天，没关系，按自己的节奏来，每做一题都算数。`;
  }
  const pu=P[dayNow-1];
  const planTxt=pu==="R"?"总复习":`单元${pu}「${UNITS[pu-1].name}」`;
  document.getElementById("dash").innerHTML=`
    <div class="dash-top">
      <div><span class="muted">今日目标</span>
        <div class="dash-big">${Math.min(tc,g)} / ${g} 题${tc>g?`<span class="muted">　＋超前 ${tc-g} 题</span>`:""}</div></div>
      <div class="muted" style="text-align:right">每日目标
        <select onchange="setGoal(this.value)">${[10,15,20,30].map(x=>`<option value="${x}" ${x===g?"selected":""}>${x}题</option>`).join("")}</select>
        <br>总正确率 ${pct}% ｜ 最佳连对 ${S.best}</div>
    </div>
    <div class="barw"><div style="width:${Math.min(100,tc/g*100)}%"></div></div>
    <div class="muted">按日历：计划第 ${cal} 天　｜　按完成量：第 ${dayNow} 天（${planTxt}）</div>
    <div class="cheer">${msg}</div>`;
}

function renderCal(){
  const cells=[];
  const d=new Date();
  d.setDate(d.getDate()-27);
  for(let i=0;i<28;i++){
    const key=fmtDate(d), c=S.days[key]||0, done=!!S.checkins[key];

    const cls=done?"done":c?"part":"";
    const isToday=i===27;
    cells.push(`<div class="cell ${cls} ${isToday?"today":""}" title="${key}：${c}题"><div>${d.getMonth()+1}/${d.getDate()}</div><b>${done?"✓":c?c:""}</b></div>`);
    d.setDate(d.getDate()+1);
  }
  const totalCk=Object.keys(S.checkins).length;
  document.getElementById("cal").innerHTML=`<h3 style="margin-top:0">${pname()}的打卡记录</h3>
    <div class="muted">累计打卡 ${totalCk} 天 ｜ 连续打卡 ${checkinStreak()} 天 ｜ 深绿✓＝完成当天目标，浅绿数字＝做了几题</div>
    <div class="cal">${cells.join("")}</div>`;
}

function renderTabs(){
  document.getElementById("tabs").innerHTML=`
    <button class="tab ${mode==="course"?"on":""}" onclick="setMode('course')">课程</button>
    <button class="tab ${mode==="review"?"on":""}" onclick="setMode('review')">错题复习（${S.wrong.length}）</button>
    <button class="tab ${mode==="free"?"on":""}" onclick="setMode('free')">自由练习</button>
    ${mode==="free"?`<select onchange="setLevel(this.value)">
      <option value="1" ${level===1?"selected":""}>入门（2～3步）</option>
      <option value="2" ${level===2?"selected":""}>标准（3～4步）</option>
      <option value="3" ${level===3?"selected":""}>挑战（4～6步）</option></select>`:""}`;
}

function renderUnits(){
  const cu=curUnit();
  document.getElementById("units").innerHTML=`<h3 style="margin-top:0">课程单元</h3>`+UNITS.map(u=>{
    const U=S.units[u.id], lock=u.id>cu;
    const st=U.passed?"✓ 已通过":lock?"未解锁":"进行中";
    const a=U.recent.length?Math.round(acc(U)*100)+"%":"—";
    return `<div class="unit ${lock?"lock":""} ${mode==="course"&&selUnit===u.id?"sel":""}" ${lock?"":`onclick="selectUnit(${u.id})"`}>
      <div><b>单元${u.id} ${u.name}</b><span class="lv">${u.lv}</span><div class="muted">${u.desc}</div></div>
      <div class="ur"><div>${Math.min(U.done,u.total)}/${u.total}</div><div class="muted">${st} · 近20题 ${a}</div></div>
    </div>`;

  }).join("")+`<div class="muted">过关条件：题数做满，并且最近20题正确率达到80%。共 ${VERBS.length} 个动词，题目每次随机组合。</div>`;
}

function renderPlan(){
  const P=plan(), t=today(), cal=Math.min(P.length,dayDiff(S.start,t)+1), prog=Math.floor(S.course/S.goal)+1;
  let h=`<details><summary>查看${P.length}天学习计划（每天${S.goal}题）</summary><table><tr><th>天</th><th>内容</th><th>状态</th></tr>`;
  P.forEach((p,i)=>{
    const d=i+1;
    const name=p==="R"?"总复习（错题复习＋自由练习）":`单元${p} ${UNITS[p-1].name}（${UNITS[p-1].lv}）`;
    let st=d<prog?"✓ 完成":d===prog?"← 你在这里":"";
    if(d===cal) st+=(st?" ":"")+"（今天）";
    h+=`<tr class="${d===prog?"cur":""}"><td>第${d}天</td><td>${name}</td><td>${st}</td></tr>`;
  });
  h+=`</table><div class="muted" style="margin-top:8px">可以超前做，计划会按完成量往前推。改每日目标后，计划天数会自动调整。</div></details>`;
  document.getElementById("plan").innerHTML=h;
}

function renderAll(){renderHeader();renderDash();renderTabs();renderCal();renderUnits();renderPlan();}

document.addEventListener("keydown",e=>{
  if(e.key!=="Enter"||e.isComposing) return;
  if(phase==="ask") submit();
  else if(phase==="done") next();
});

save();
newChain();
</script>
</body>
</html>

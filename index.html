<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#222;--muted:#777;--line:#e4e1d8;--accent:#0f6e56;--accent-bg:#e1f5ee;--ng:#a32d2d;--ng-bg:#fcebeb;--warn-bg:#faeeda;--warn:#854f0b;--gold-bg:#fff4d6;--gold:#7a5300;--pink:#993556;--pink-bg:#fbeaf0;--blue:#185fa5;--blue-bg:#e6f1fb}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","PingFang SC","Noto Sans JP","Microsoft YaHei",sans-serif;line-height:1.7}
.wrap{max-width:760px;margin:0 auto;padding:24px 16px 60px}
h1{font-size:22px;margin:0 0 6px;color:var(--pink)}
h3{font-size:16px;margin:18px 0 8px}
.greet{background:var(--pink-bg);color:var(--pink);border-radius:10px;padding:10px 14px;font-size:16px;font-weight:bold;margin:10px 0 14px}
.profiles{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:15px}
.sync{font-size:12px;border-radius:10px;padding:2px 10px;background:var(--blue-bg);color:var(--blue)}
.sync.fail{background:var(--ng-bg);color:var(--ng)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:14px}
.hidden{display:none}
.muted{color:var(--muted);font-size:13px}
.barw{height:10px;background:var(--line);border-radius:5px;overflow:hidden;margin:8px 0}
.barw>div{height:100%;background:var(--accent);transition:width .3s}
.dash-top{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px}
.dash-big{font-size:20px;font-weight:bold;color:var(--accent)}
.cheer{background:var(--accent-bg);color:var(--accent);border-radius:8px;padding:10px 12px;font-size:14px;margin-top:10px}
.task{background:var(--blue-bg);color:var(--blue);border-radius:8px;padding:10px 12px;font-size:14px;margin-top:10px}
.tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.tab{flex:1;min-width:84px;padding:10px 6px;border:1px solid var(--line);background:var(--card);border-radius:8px;font-size:14px;cursor:pointer}
.tab.on{background:var(--accent);color:#fff;border-color:var(--accent)}
select{padding:5px 8px;border-radius:8px;border:1px solid var(--line);font-size:14px}
.qtop{font-size:13px;color:var(--accent);margin-bottom:4px}
.qhead{font-size:19px;font-weight:bold}
.box{background:var(--accent-bg);border-radius:10px;padding:12px 14px;margin:12px 0}
.box .big{font-size:22px;color:var(--accent)}
.blank{display:inline-block;min-width:3em;border-bottom:2px solid var(--accent);text-align:center}
.lbl{display:inline-block;font-size:12px;color:var(--accent);background:var(--accent-bg);border-radius:10px;padding:0 8px;margin-right:8px}
.row{margin:8px 0}
.inputrow{display:flex;gap:8px;margin-top:14px}
input[type=text],input[type=password]{flex:1;min-width:0;font-size:20px;padding:10px 12px;border:1px solid var(--line);border-radius:8px}
.btn{padding:9px 16px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:15px}
.btn.main{background:var(--accent);color:#fff;border-color:var(--accent)}
button:disabled{opacity:.5;cursor:default}
.mini{padding:2px 10px;border-radius:6px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:13px;margin-left:6px}
.link{background:none;border:none;color:var(--accent);cursor:pointer;font-size:14px;padding:0;margin-top:10px;text-decoration:underline}
.hint{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:10px 12px;font-size:14px;margin-top:8px}
.err{color:var(--ng);font-size:13px;margin-top:6px}
.ok-h{color:var(--accent);font-size:19px;font-weight:bold}
.ng-h{color:var(--ng);font-size:19px;font-weight:bold}
.praise{color:var(--accent);font-size:14px}
.comfort{color:var(--muted);font-size:14px}
.celebrate{background:var(--gold-bg);color:var(--gold);border-radius:10px;padding:12px 14px;margin:10px 0;font-size:15px;font-weight:bold}
.diag{background:var(--ng-bg);color:var(--ng);border-radius:8px;padding:10px 12px;font-size:14px;margin:10px 0}
.note{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:10px 12px;font-size:14px;margin:10px 0}
table{width:100%;border-collapse:collapse;font-size:15px}
td,th{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}
th{font-size:13px;color:var(--muted);font-weight:normal}
tr.cur td{background:var(--accent-bg)}
.btns{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px;align-items:center}
.ex{border-bottom:1px dashed var(--line);padding:8px 0}
.exja{font-size:17px}
.opt{display:block;width:100%;text-align:left;margin-top:8px;padding:11px 14px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer;font-size:17px;color:var(--ink)}
.opt.right{background:var(--accent-bg);border-color:var(--accent)}
.opt.wrong{background:var(--ng-bg);border-color:var(--ng)}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.mt{display:block;width:100%;margin-bottom:8px;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer;font-size:16px;text-align:left;color:var(--ink)}
.mt.sel{outline:3px solid var(--accent)}
.mt.paired.c0{background:#fbeaf0;border-color:#993556}
.mt.paired.c1{background:#e6f1fb;border-color:#185fa5}
.mt.paired.c2{background:#e1f5ee;border-color:#0f6e56}
.mt.paired.c3{background:#fff4d6;border-color:#7a5300}
.unit{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;cursor:pointer}
.unit.sel{border-color:var(--accent);background:var(--accent-bg)}
.unit.lock{opacity:.5;cursor:default}
.unit .ur{text-align:right;white-space:nowrap}
.lv{font-size:12px;background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:0 8px;margin-left:4px}
.mrow{display:grid;grid-template-columns:96px 1fr 72px 92px;gap:8px;align-items:center;margin:6px 0;font-size:14px}
.mbar{height:10px;background:var(--line);border-radius:5px;overflow:hidden}
.mbar>div{height:100%}
.mbar .good{background:var(--accent)}
.mbar .mid{background:#ba7517}
.mbar .bad{background:var(--ng)}
.mst.good{color:var(--accent)}
.mst.mid{color:var(--warn)}
.mst.bad{color:var(--ng)}
.tip{border-bottom:1px solid var(--line);padding:8px 0}
.tip summary{cursor:pointer;font-weight:bold}
.tipb{font-size:15px;margin-top:6px;line-height:1.9}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}
.cell{border-radius:8px;padding:4px 0;text-align:center;font-size:12px;background:#f1efe8;color:var(--muted);min-height:44px}
.cell.part{background:var(--accent-bg);color:var(--accent)}
.cell.done{background:var(--accent);color:#fff}
.cell.today{outline:2px solid var(--pink)}
.cell b{display:block;font-size:14px}
.pkrow{margin:10px 0}
.pkname{display:flex;justify-content:space-between;font-size:15px}
.pkbar{height:16px;background:var(--line);border-radius:8px;overflow:hidden;margin-top:4px}
.pkbar>div{height:100%;transition:width .3s}
.p0{background:var(--pink)}
.p1{background:var(--blue)}
.crown{color:var(--gold);font-weight:bold}
.pkmsg{background:var(--gold-bg);color:var(--gold);border-radius:8px;padding:10px 12px;font-size:15px;font-weight:bold;margin-top:10px}
.setup label{display:block;margin:12px 0 4px;font-size:14px;color:var(--muted)}
.setup input[type=text],.setup input[type=password]{width:100%}
.whobtn{display:block;width:100%;padding:18px;font-size:22px;font-weight:bold;border-radius:14px;margin:12px 0;background:#fff;cursor:pointer;border:2px solid var(--line)}
.whobtn.w0{border-color:var(--pink);color:var(--pink);background:var(--pink-bg)}
.whobtn.w1{border-color:var(--blue);color:var(--blue);background:var(--blue-bg)}
details summary{cursor:pointer;font-weight:bold}
@media (max-width:520px){.mrow{grid-template-columns:80px 1fr 64px;}.mrow>div:last-child{display:none}}
</style>
</head>
<body>
<div class="wrap">
  <h1 id="title">练习册</h1>
  <div class="card setup" id="setup"><div class="muted">正在加载…</div></div>
  <div id="main" class="hidden">
    <div class="profiles" id="profiles"></div>
    <div class="greet" id="greet"></div>
    <div class="card" id="dash"></div>
    <div class="tabs" id="tabs"></div>
    <div class="card" id="q"></div>
    <div class="card hidden" id="res"></div>
    <div class="card" id="pk"></div>
    <div class="card" id="mastery"></div>
    <div class="card" id="cal"></div>
    <div class="card" id="units"></div>
    <div class="card" id="plan"></div>
  </div>
</div>
